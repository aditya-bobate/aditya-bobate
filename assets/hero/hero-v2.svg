<svg width="900" height="360" viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Aditya Bobate - Developer Profile</title>
  <desc>Animated terminal-style header card: ADITYA BOBATE, B.Tech CSE at Manipal University Jaipur, focused on Cloud Computing, Software Engineering and AI.</desc>

  <defs>
    <clipPath id="frameClip">
      <rect x="3" y="3" width="894" height="354" rx="16" ry="16"/>
    </clipPath>

    <linearGradient id="borderGrad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="900" y2="0">
      <stop offset="0%"  stop-color="#30363D" stop-opacity="0"/>
      <stop offset="45%" stop-color="#58A6FF" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#A371F7" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#30363D" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="rotate"
        from="0 450 180" to="360 450 180" dur="11s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#58A6FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#79C0FF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#58A6FF" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="vignette" cx="50%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#1C2333" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>

    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M 26 0 L 0 0 0 26" fill="none" stroke="#8B949E" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>

    <clipPath id="typeClip">
      <rect x="212" y="88" width="0" height="22">
        <animate attributeName="width" begin="0.95s" dur="0.55s" fill="freeze"
          calcMode="discrete"
          keyTimes="0;0.071;0.143;0.214;0.286;0.357;0.429;0.5;0.571;0.643;0.714;0.786;0.857;0.929;1"
          values="0;11;22;33;44;55;66;77;88;99;110;121;132;143;154"/>
      </rect>
    </clipPath>

    <style>
      .mono { font-family: 'SFMono-Regular','Consolas','Courier New',monospace; }
      .reveal { opacity: 0; animation: fadeUp .6s cubic-bezier(.2,.7,.3,1) forwards; }
      .d1 { animation-delay: .45s; }
      .d2 { animation-delay: 1.30s; }
      .d3 { animation-delay: 1.72s; }
      .d4 { animation-delay: 2.10s; }
      .d5 { animation-delay: 2.32s; }
      .d6 { animation-delay: 2.58s; }
      .d7 { animation-delay: 2.92s; }
      .frameIn { opacity: 0; animation: fadeIn .5s ease-out forwards; }
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(7px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      @keyframes blink { 0%, 45% { opacity: 1; } 50%, 95% { opacity: 0; } 100% { opacity: 1; } }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
      .cursor { animation: blink 1.1s step-end infinite; animation-delay: 3.1s; }
      .statusDot { animation: pulse 2.4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Outer surface -->
  <rect x="3" y="3" width="894" height="354" rx="16" ry="16" fill="#0D1117"/>

  <g clip-path="url(#frameClip)">
    <rect x="3" y="3" width="894" height="354" fill="url(#grid)"/>
    <rect x="3" y="3" width="894" height="354" fill="url(#vignette)"/>

    <!-- Header bar -->
    <rect x="3" y="3" width="894" height="44" fill="#161B22"/>
    <line x1="3" y1="47" x2="897" y2="47" stroke="#21262D" stroke-width="1"/>

    <circle cx="30" cy="25" r="6" fill="#FF5F56" fill-opacity="0.85"/>
    <circle cx="50" cy="25" r="6" fill="#FFBD2E" fill-opacity="0.85"/>
    <circle cx="70" cy="25" r="6" fill="#27C93F" fill-opacity="0.85"/>

    <text x="450" y="30" text-anchor="middle" fill="#8B949E" font-size="13" class="mono">aditya@github: ~</text>

    <!-- Status indicator -->
    <circle class="statusDot" cx="833" cy="25" r="4" fill="#3FB950"/>
    <text x="845" y="29" fill="#8B949E" font-size="12" letter-spacing="1" class="mono">ONLINE</text>

    <!-- Header scanline sweep (one-time) -->
    <rect x="-160" y="3" width="160" height="44" fill="url(#scanGrad)">
      <animateTransform attributeName="transform" type="translate"
        from="0 0" to="1060 0" begin="0.15s" dur="1s" fill="freeze"/>
    </rect>

    <!-- Prompt + typed command -->
    <text x="44" y="100" fill="#58A6FF" font-size="16" class="mono reveal d1">aditya@github:~$</text>
    <text x="212" y="100" fill="#C9D1D9" font-size="16" class="mono" clip-path="url(#typeClip)">./introduce.sh</text>

    <!-- Name -->
    <text x="42" y="158" fill="#F0F6FC" font-size="43" font-weight="700" class="mono reveal d2">ADITYA BOBATE</text>

    <!-- Education -->
    <text x="44" y="194" fill="#8B949E" font-size="17" class="mono reveal d3">B.Tech CSE @ Manipal University Jaipur</text>

    <!-- Focus line -->
    <g class="reveal d4">
      <text x="44" y="228" fill="#58A6FF" font-size="16" class="mono">Cloud Computing</text>
      <text x="207" y="228" fill="#484F58" font-size="16" class="mono">•</text>
      <text x="227" y="228" fill="#A371F7" font-size="16" class="mono">Software Engineering</text>
      <text x="427" y="228" fill="#484F58" font-size="16" class="mono">•</text>
      <text x="447" y="228" fill="#3FB950" font-size="16" class="mono">AI</text>
    </g>

    <!-- Separator -->
    <line x1="44" y1="251" x2="856" y2="251" stroke="#21262D" stroke-width="1" class="reveal d5"/>

    <!-- Quote -->
    <text x="44" y="283" fill="#8B949E" font-size="15" font-style="italic" class="mono reveal d6">"I build, break, and occasionally optimize."</text>

    <!-- Bottom prompt + cursor -->
    <text x="44" y="327" fill="#58A6FF" font-size="16" class="mono reveal d7">aditya@github:~$</text>
    <rect x="180" y="313" width="9" height="18" fill="#58A6FF" filter="url(#softGlow)" class="reveal d7 cursor"/>
  </g>

  <!-- Animated border -->
  <rect x="3" y="3" width="894" height="354" rx="16" ry="16" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" class="frameIn"/>
  <rect x="3" y="3" width="894" height="354" rx="16" ry="16" fill="none" stroke="#30363D" stroke-width="1" class="frameIn"/>
</svg>
